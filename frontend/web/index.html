<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Hệ thống quản lý bán hàng, kho hàng và công nợ thực chiến">
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#FFFFFF">
  <meta name="google-signin-client_id" content="1070073470852-hc12cgovbt9h7micnu072vpkvigee28u.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kho Trà Sữa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2.1">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png?v=2.1">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png?v=2.1">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2.1"/>

  <title>Kho Trà Sữa · QuanLyKho</title>
  <link rel="manifest" href="manifest.json?v=2.1">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    @media (prefers-color-scheme: dark) {
      html, body {
        background-color: #0F172A;
      }
    }
    #app-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #F8FAFC;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }
    #app-splash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 24px;
      max-width: 320px;
    }
    .tea-icon {
      width: 68px;
      height: 68px;
      margin-bottom: 20px;
      animation: teaPulse 1.8s infinite ease-in-out;
    }
    @keyframes teaPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .splash-title {
      font-size: 20px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }
    .splash-desc {
      font-size: 13px;
      color: #64748B;
      margin-bottom: 24px;
    }
    .progress-bar-container {
      width: 140px;
      height: 4px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #0284C7, #059669);
      border-radius: 999px;
      position: absolute;
      animation: progressIndeterminate 1.2s infinite ease-in-out;
    }
    @keyframes progressIndeterminate {
      0% { left: -45%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div id="app-splash" aria-label="Đang tải Quản Lý Bán Hàng & Kho">
    <div class="splash-card">
      <svg class="tea-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="16" fill="url(#gradLogo)"/>
        <!-- Biểu tượng Kho & Bán Hàng hiện đại -->
        <path d="M18 24L32 16L46 24L32 32L18 24Z" fill="white" fill-opacity="0.95"/>
        <path d="M18 27L30 34V47L18 40V27Z" fill="white" fill-opacity="0.75"/>
        <path d="M34 34L46 27V40L34 47V34Z" fill="white" fill-opacity="0.88"/>
        <!-- Mũi tên tăng trưởng / kinh doanh -->
        <circle cx="44" cy="20" r="5" fill="#34D399"/>
        <path d="M42 20L44 18L46 20" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="gradLogo" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
            <stop stop-color="#0284C7"/>
            <stop offset="1" stop-color="#0F766E"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="splash-title">Quản Lý Bán Hàng & Kho</div>
      <div class="splash-desc">Đang tải dữ liệu kinh doanh...</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <script>
    (function() {
      function removeSplash() {
        var splash = document.getElementById('app-splash');
        if (splash && !splash.classList.contains('fade-out')) {
          splash.classList.add('fade-out');
          setTimeout(function() {
            if (splash && splash.parentNode) {
              splash.parentNode.removeChild(splash);
            }
          }, 360);
        }
      }
      window.addEventListener('flutter-first-frame', removeSplash);
      // Fallback khi DOM đã có flutter-view nhưng frame event bị miss
      var checkInterval = setInterval(function() {
        if (document.querySelector('flutter-view, flt-glass-pane')) {
          clearInterval(checkInterval);
          removeSplash();
        }
      }, 500);
      setTimeout(function() {
        clearInterval(checkInterval);
        removeSplash();
      }, 6000);

      // Chống crash và reload trang khi xoay màn hình hoặc sleep trên mobile browsers (Safari / Zalo)
      window.addEventListener('webglcontextlost', function(e) {
        e.preventDefault();
      }, true);
      window.addEventListener('webglcontextrestored', function(e) {
        console.log('[WebOps] WebGL context restored');
      }, true);

      // PWA Install prompt handler
      var deferredPrompt = null;
      window.isPwaInstallAvailable = false;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        deferredPrompt = e;
        window.isPwaInstallAvailable = true;
        console.log('[PWA] beforeinstallprompt captured');
      });

      window.promptPwaInstall = function() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(function(choiceResult) {
            console.log('[PWA] User choice: ' + choiceResult.outcome);
            deferredPrompt = null;
            window.isPwaInstallAvailable = false;
          });
          return true;
        }
        return false;
      };

      // Tự động kiểm tra và cập nhật Service Worker & Phiên bản Web khi có bản mới
      var isReloading = false;
      window.appCurrentBuild = null;
      window.isAppUpdateAvailable = false;

      window.checkAppVersionUpdate = function() {
        fetch('/version.json?_t=' + Date.now(), { cache: 'no-store' })
          .then(function(res) {
            if (!res.ok) return null;
            return res.json();
          })
          .then(function(data) {
            if (!data || !data.build_number) return;
            if (!window.appCurrentBuild) {
              window.appCurrentBuild = data.build_number;
              return;
            }
            if (window.appCurrentBuild !== data.build_number) {
              console.log('[PWA] Phát hiện phiên bản mới: ' + data.build_number + ' (bản hiện tại: ' + window.appCurrentBuild + ')');
              window.isAppUpdateAvailable = true;
              window.dispatchEvent(new CustomEvent('app-update-available', { detail: data }));
            }
          })
          .catch(function() {
            // Chạy offline an toàn, không báo lỗi
          });
      };
      // Gọi kiểm tra lần đầu
      window.checkAppVersionUpdate();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          if (isReloading) return;
          isReloading = true;
          console.log('[PWA] Service worker controller changed. Đang nạp lại phiên bản mới...');
          window.location.reload();
        });

        function checkSwAndVersion() {
          navigator.serviceWorker.getRegistration().then(function(reg) {
            if (reg) {
              reg.update();
              if (reg.waiting) {
                try {
                  reg.waiting.postMessage({ type: 'SKIP_WAITING' });
                } catch (_) {}
              }
            }
          });
          window.checkAppVersionUpdate();
        }

        window.addEventListener('focus', checkSwAndVersion);
        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
            checkSwAndVersion();
          }
        });
        // Định kỳ kiểm tra mỗi 90s khi tab đang mở
        setInterval(checkSwAndVersion, 90000);
      }

      // Hàm dọn sạch toàn bộ cache và nạp phiên bản mới nhất
      window.forceAppUpdate = async function() {
        console.log('[PWA] Đang xóa toàn bộ cache và làm mới ứng dụng...');
        try {
          if ('caches' in window) {
            var cacheKeys = await caches.keys();
            await Promise.all(cacheKeys.map(function(key) {
              return caches.delete(key);
            }));
          }
          if ('serviceWorker' in navigator) {
            var registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map(function(r) {
              return r.unregister();
            }));
          }
        } catch (err) {
          console.warn('[PWA] Lỗi dọn cache:', err);
        }
        var targetUrl = new URL(window.location.href);
        targetUrl.searchParams.set('_v', Date.now().toString());
        window.location.replace(targetUrl.toString());
      };
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
