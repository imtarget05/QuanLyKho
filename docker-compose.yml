services:
  postgres:
    profiles: ["backend"]
    image: postgres:16-alpine
    container_name: kho-tra-sua-db
    environment:
      POSTGRES_USER: kho-tra-sua
      POSTGRES_PASSWORD: kho-tra-sua
      POSTGRES_DB: kho-tra-sua
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kho-tra-sua"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    profiles: ["backend"]
    build:
      context: backend
    container_name: kho-tra-sua-api
    # Optional, ignored local configuration. Production injects secrets through
    # its platform secret manager instead; do not create this file in CI.
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://kho-tra-sua:kho-tra-sua@postgres:5432/kho-tra-sua
      - APP_ENV=demo
      - DEMO_MODE=false
      - ALLOWED_ORIGINS=["http://localhost:3000","http://localhost:8080","http://127.0.0.1:8080"]
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - CLOUDFLARE_MODEL=${CLOUDFLARE_MODEL:-@cf/meta/llama-3.1-8b-instruct}
      - AI_PROVIDER=${AI_PROVIDER:-cloudflare}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      # Email is opt-in.  Do not put SMTP credentials or provider defaults here:
      # configure it in the ignored backend/.env file for local testing.
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      sh -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "

  worker:
    profiles: ["backend"]
    build:
      context: backend
    container_name: kho-tra-sua-worker
    depends_on:
      api:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://kho-tra-sua:kho-tra-sua@postgres:5432/kho-tra-sua
      - APP_ENV=demo
    restart: unless-stopped
    command: >
      sh -c "
        python -m app.worker
      "

  frontend-web:
    image: nginx:alpine
    container_name: kho-tra-sua-frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    environment:
      - NGINX_HOST=localhost
      - NGINX_PORT=80
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
