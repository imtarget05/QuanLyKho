# ============================================================================
# BankOps Monitoring Stack (OpenTelemetry + Prometheus + Grafana + Loki)
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Services:
#   otel-collector  - receives OTLP traces/metrics/logs, forwards to Prometheus/Loki
#   prometheus      - scrapes /metrics from backend + OTel collector metrics
#   loki            - log aggregation (receives from Promtail + OTel log exporter)
#   promtail        - tails Docker container logs -> Loki
#   grafana         - dashboards (Provisioned: Prometheus + Loki datasources)
# ============================================================================

services:

  # --- OpenTelemetry Collector ---
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.0
    container_name: kho-tra-sua-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # metrics (Prometheus scrapes)
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  # --- Prometheus ---
  prometheus:
    image: prom/prometheus:v2.53.3
    container_name: kho-tra-sua-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  # --- Loki ---
  loki:
    image: grafana/loki:2.9.7
    container_name: kho-tra-sua-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./docker/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  # --- Promtail ---
  promtail:
    image: grafana/promtail:2.9.7
    container_name: kho-tra-sua-promtail
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ./docker/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped

  # --- Grafana ---
  grafana:
    image: grafana/grafana:10.4.0
    container_name: kho-tra-sua-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docker/grafana/dashboards/bankops-dashboard.json:/etc/grafana/provisioning/dashboards/bankops-dashboard.json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
  loki_data:
  grafana_data: