# ============================================================================
# Prometheus config — BankOps
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  # Prometheus self
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # OTel Collector metrics
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
        labels:
          app: bankops
          component: otel-collector

  # BankOps API (/metrics endpoint)
  - job_name: bankops-api
    static_configs:
      - targets: ['api:8000']
        labels:
          app: bankops
          component: api

  # BankOps worker (same image, exposes /metrics if instrumented)
  - job_name: bankops-worker
    static_configs:
      - targets: ['worker:8000']
        labels:
          app: bankops
          component: worker

  # Node exporter (optional, if added later)
  # - job_name: node
  #   static_configs:
  #     - targets: ['node-exporter:9100']