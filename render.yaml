# NOTE (P3.2 reconciliation, 2026-11-13): the canonical production API runs on
# Modal (`deploy-pages.yml` builds Flutter -> Cloudflare Workers Assets pointed
# at imtarget05--quan-ly-kho-tra-sua-api.us-east.modal.run). This blueprint
# deploys the same FastAPI app to Render free tier as a secondary/preview
# environment. Do not treat this file as the production cutover path.
services:
  - type: web
    name: kho-tra-sua-fastapi
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health/ready
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVER_RELOAD
        value: "false"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # P3.3 — AI luồng bật cho production (2026-11-12). cloudflare = Workers AI;
      # ollama = CPU local (ai/serve_cpu.py). Cần CLOUDFLARE_ACCOUNT_ID +
      # CLOUDFLARE_API_TOKEN secret trong Render dashboard trước khi deploy.
      - key: AI_PROVIDER
        value: cloudflare
      - key: FRONTEND_BASE_URL
        value: https://quan-ly-kho-tra-sua.tanmainguyenbinh.workers.dev
      - key: ALLOWED_ORIGINS
        value: '["https://quan-ly-kho-tra-sua.tanmainguyenbinh.workers.dev", "https://quan-ly-kho-tra-sua.pages.dev"]'
      # Secrets are supplied only in the Render dashboard at Blueprint creation.
      - key: DATABASE_URL
        sync: false
      # Production login fails closed without a reachable TLS Redis instance.
      - key: REDIS_URL
        sync: false
      - key: BANKOPS_SIGNING_KEY
        generateValue: true
      - key: BANKOPS_SESSION_SECRET
        generateValue: true
      # Email Service (Gmail SMTP)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_FROM_NAME
        value: Ban Quản Trị Hệ Thống
      - key: SMTP_PASSWORD
        sync: false
