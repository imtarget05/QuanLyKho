# DEPRECATED (ADR 022): Render is no longer the canonical production deploy target.
# AKS + ArgoCD is the single canonical target (see docs/adr/022-single-canonical-deploy-target-aks-argocd.md).
# Do not use this file for new production deployments. Secret/Render dashboard will be removed
# after ArgoCD sync is confirmed stable.
services:
  - type: web
    name: kho-tra-sua-fastapi
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: SERVER_RELOAD
        value: "false"
      - key: AI_PROVIDER
        value: disabled
      - key: FRONTEND_BASE_URL
        value: https://quan-ly-kho-tra-sua.tanmainguyenbinh.workers.dev
      - key: ALLOWED_ORIGINS
        value: '["https://quan-ly-kho-tra-sua.tanmainguyenbinh.workers.dev"]'
      # Secrets are supplied only in the Render dashboard at Blueprint creation.
      - key: DATABASE_URL
        sync: false
      - key: BANKOPS_SIGNING_KEY
        generateValue: true
      - key: BANKOPS_SESSION_SECRET
        generateValue: true
      # Email Service (Gmail SMTP)
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: admin@example.com
      - key: SMTP_FROM_NAME
        value: Ban Quản Trị Hệ Thống
      - key: SMTP_PASSWORD
        sync: false
