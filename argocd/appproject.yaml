# AppProject "portfolio" — scope for QuanLyKho GitOps applications.
#
# NOTE: destination server is a placeholder for the in-cluster API server
# (https://kubernetes.default.svc works when Argo CD itself runs on the target
# cluster). Replace with the real cluster name/server URL when registering
# external clusters, e.g.:
#   name: production   server: https://<prod-cluster-api>
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: portfolio
  namespace: argocd
  labels:
    app.kubernetes.io/name: portfolio
    app.kubernetes.io/part-of: argocd
spec:
  description: GitOps portfolio — QuanLyKho Helm chart (prod + staging)
  sourceRepos:
    - https://github.com/imtarget05/QuanLyKho.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: quanlykho-prod
    - server: https://kubernetes.default.svc
      namespace: quanlykho-staging
  # Minimal cluster-scoped permissions: only Namespace objects (Argo CD's
  # CreateNamespace=true sync option creates namespaces for us).
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: ""
      kind: ResourceQuota
  roles:
    - name: admin
      policies:
        - p, proj:portfolio:admin, applications, *, portfolio/*, allow
      groups:
        - argocd-admins
