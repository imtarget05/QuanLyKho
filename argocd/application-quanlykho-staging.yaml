# QuanLyKho staging application — renders the helm/quanlykho chart with
# values-staging.yaml. Depends on PR #26 (feat/helm-chart) being merged.
#
# NOTE: destination server is a placeholder (in-cluster API server); see
# argocd/README.md.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quanlykho-staging
  namespace: argocd
  labels:
    app.kubernetes.io/name: quanlykho-staging
    app.kubernetes.io/part-of: portfolio
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio
  source:
    repoURL: https://github.com/imtarget05/QuanLyKho.git
    targetRevision: main
    path: helm/quanlykho
    helm:
      releaseName: quanlykho-staging
      valueFiles:
        - values-staging.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: quanlykho-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
