name: S11 — Cloud CI Full E2E Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/tests/test_ml_training.py'
      - 'backend/tests/test_e2e_verify.py'
      - 'backend/tests/test_ml_registry.py'
      - 'backend/tests/test_inference_api.py'
      - 'backend/tests/test_drift_detection.py'
      - 'backend/tests/test_airflow_dags.py'
      - 'backend/tests/test_airflow_ingest_tasks.py'
      - 'backend/scripts/e2e_verify.py'
      - 'backend/app/services/'
      - 'backend/app/api/inference.py'
      - 'backend/alembic/**'
      - 'backend/pyproject.toml'
      - 'infra/airflow/**'
      - '.github/workflows/s11-e2e-cloud-ci.yml'

env:
  PYTHON_VERSION: "3.11"
  # DB service của CI (disposable). KHÔNG phải DB dev `bankops`.
  # Dùng `localhost` (service container publish port 5432:5432) — đồng bộ với
  # hướng của `main` và với WIP đang chờ của actor khác.
  CI_DATABASE_URL: "postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test"
  # DB metadata của Airflow — tách riêng khỏi DB ứng dụng.
  CI_AIRFLOW_DATABASE_URL: "postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test_airflow"

jobs:
  cloud-ci-e2e-verified:
    name: CLOUD_CI_E2E_VERIFIED
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bankops_test
          POSTGRES_USER: bankops
          POSTGRES_PASSWORD: bankops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install Poetry
        # poetry-plugin-export: workflow cần `poetry export` để dựng venv Airflow
        # cô lập từ đúng bộ dependency đã khoá.
        run: pip install poetry==2.5.1 poetry-plugin-export==1.10.1

      # ---------------------------------------------------------------------
      # FIX 1 — dependency phải được cài TRƯỚC mọi step chạy test.
      # Trước đây step "Install dependencies" nằm SAU step "Airflow DAG run",
      # nên `poetry run python -m pytest` chạy trong venv chưa có dependency.
      # ---------------------------------------------------------------------
      - name: Install backend dependencies (Poetry venv)
        working-directory: backend
        run: poetry install --no-interaction --no-ansi

      - name: Export backend requirements (locked)
        working-directory: backend
        run: poetry export -o "$RUNNER_TEMP/backend-requirements.txt" --without-hashes --with dev

      # ---------------------------------------------------------------------
      # Môi trường Airflow — TÁCH BIỆT khỏi venv backend, vì:
      #   * Airflow 2.10.4 yêu cầu `sqlalchemy<2.0`, còn backend yêu cầu
      #     `sqlalchemy>=2.0.35,<2.1` (ORM dùng `Mapped[]`) ⇒ không thể cài
      #     chung một venv;
      #   * vì vậy mọi test Airflow đều chạy trong venv CÓ Airflow, không cài
      #     Airflow vào system python rồi để pytest `importorskip` (CI xanh
      #     vacuous — đúng lỗi đã bị G2 chỉ ra).
      # ---------------------------------------------------------------------
      - name: Create isolated Airflow runtime venv (apache-airflow 3.3.2)
        run: |
          set -e
          python -m venv "$RUNNER_TEMP/airflow-runtime"
          "$RUNNER_TEMP/airflow-runtime/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/airflow-runtime/bin/pip" install -r "$RUNNER_TEMP/backend-requirements.txt"
          "$RUNNER_TEMP/airflow-runtime/bin/pip" install \
            "apache-airflow==3.3.2" \
            "apache-airflow-providers-standard==1.20.1"
          "$RUNNER_TEMP/airflow-runtime/bin/python" -c \
            "import airflow, sqlalchemy; print('airflow', airflow.__version__, '| sqlalchemy', sqlalchemy.__version__)"

      - name: Create Airflow 2.10.4 compatibility venv
        # Cổng tương thích: test DAG phải chạy được với Airflow 2.10.4 (version
        # branch từng pin) — 2.10.4 không chứa được app code (SQLAlchemy <2.0)
        # nên chỉ dùng để chạy test CẤU TRÚC DAG.
        run: |
          set -e
          python -m venv "$RUNNER_TEMP/airflow-2104"
          "$RUNNER_TEMP/airflow-2104/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/airflow-2104/bin/pip" install "apache-airflow==2.10.4" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.4/constraints-3.11.txt"
          "$RUNNER_TEMP/airflow-2104/bin/pip" install "pytest==8.3.5"
          "$RUNNER_TEMP/airflow-2104/bin/python" -c "import airflow; print('airflow', airflow.__version__)"

      - name: Prepare run directories
        run: |
          mkdir -p "$RUNNER_TEMP/mlflow-s11/mlruns"
          mkdir -p "$RUNNER_TEMP/s11-evidence"
          mkdir -p "$RUNNER_TEMP/airflow-home"

      - name: Create Airflow metadata database (service Postgres, không phải DB dev)
        env:
          PGPASSWORD: bankops
        run: |
          set -e
          psql -h localhost -U bankops -d postgres -tAc \
            "SELECT 1 FROM pg_database WHERE datname='bankops_test_airflow'" | grep -q 1 \
            || psql -h localhost -U bankops -d postgres -c "CREATE DATABASE bankops_test_airflow;"
          psql -h localhost -U bankops -d postgres -tAc \
            "SELECT datname FROM pg_database WHERE datname IN ('bankops','bankops_test','bankops_test_airflow')"

      - name: Initialise Airflow metadata DB
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow-home
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/infra/airflow/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${{ env.CI_AIRFLOW_DATABASE_URL }}
        run: |
          "$RUNNER_TEMP/airflow-runtime/bin/airflow" db migrate

      # ---------------------------------------------------------------------
      # FIX 2 — DAG test chạy trong môi trường CÓ Airflow (không vacuous).
      # QLK_REQUIRE_AIRFLOW=1 ⇒ thiếu Airflow là FAIL, không phải skip.
      # ---------------------------------------------------------------------
      - name: Airflow DAG structure tests (Airflow 3.3.2 runtime env)
        working-directory: backend
        env:
          QLK_REQUIRE_AIRFLOW: "1"
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          "$RUNNER_TEMP/airflow-runtime/bin/python" -m pytest tests/test_airflow_dags.py \
            -v --no-header --tb=short

      - name: Airflow DAG structure tests (Airflow 2.10.4 compatibility gate)
        working-directory: backend
        env:
          QLK_REQUIRE_AIRFLOW: "1"
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          "$RUNNER_TEMP/airflow-2104/bin/python" -m pytest tests/test_airflow_dags.py \
            -v --no-header --tb=short

      - name: Airflow ingest task tests (DB + MLflow side effects)
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          QLK_INGEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          QLK_INGEST_ALLOW_ANY_DB: "1"
          MLFLOW_TRACKING_URI: "sqlite:///${{ runner.temp }}/mlflow-s11/mlflow.db"
          QLK_INGEST_MLFLOW_TRACKING_URI: "sqlite:///${{ runner.temp }}/mlflow-s11/mlflow.db"
          QLK_INGEST_MLFLOW_ARTIFACT_DIR: "${{ runner.temp }}/mlflow-s11/mlruns"
        run: poetry run python -m pytest tests/test_airflow_ingest_tasks.py -v --no-header --tb=short

      - name: Run Alembic migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          set -e
          poetry config env.DATABASE_URL "${DATABASE_URL}" \
            || echo "WARN: không set được env var trong venv Poetry (dùng env của step)"
          echo "DATABASE_URL=$DATABASE_URL"
          # Check PostgreSQL connectivity.
          # `main` gọi `bash scripts/check_db_connectivity.sh` — nhưng script đó là
          # WIP *chưa commit* của actor khác, nằm ở GỐC repo (không phải
          # `backend/`) ⇒ tham chiếu tới đường dẫn KHÔNG tồn tại trong cây sau
          # merge. Thay bằng `pg_isready` nội tuyến: cùng ý (fail-fast với thông
          # báo rõ), không phụ thuộc file ngoài cây, không treo vô hạn.
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U bankops -d bankops_test; then
              echo "PostgreSQL sẵn sàng"
              break
            fi
            echo "PostgreSQL chưa sẵn sàng (lần ${i}/30) — chờ 2s"
            sleep 2
          done
          # Fail-closed: nếu DB vẫn chưa sẵn sàng thì dừng ngay, không migrate.
          pg_isready -h localhost -p 5432 -U bankops -d bankops_test
          poetry run alembic upgrade head

      - name: Seed database
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          APP_ENV: demo
          DEMO_MODE: "true"
        run: poetry run python -m app.seed

      # ---------------------------------------------------------------------
      # FIX 3 — chạy DAG THẬT trong CI (`airflow dags test`), DB đích là
      # service Postgres của CI, không phải DB dev.
      # ---------------------------------------------------------------------
      - name: Airflow DAG run thật (airflow dags test)
        working-directory: backend
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow-home
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/infra/airflow/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${{ env.CI_AIRFLOW_DATABASE_URL }}
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          QLK_INGEST_DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          QLK_INGEST_ALLOW_ANY_DB: "1"
          MLFLOW_TRACKING_URI: "sqlite:///${{ runner.temp }}/mlflow-s11/mlflow.db"
          QLK_INGEST_MLFLOW_TRACKING_URI: "sqlite:///${{ runner.temp }}/mlflow-s11/mlflow.db"
          QLK_INGEST_MLFLOW_ARTIFACT_DIR: "${{ runner.temp }}/mlflow-s11/mlruns"
        run: |
          # pipefail: `airflow dags test` fail ⇒ step fail (không được xanh vacuous
          # vì `tee` trả 0).
          set -euo pipefail
          for dag_id in inventory_ingestion expense_ingestion supplier_ingestion; do
            echo "=== airflow dags test ${dag_id} ==="
            "$RUNNER_TEMP/airflow-runtime/bin/airflow" dags test "${dag_id}" "$(date +%Y-%m-%d)" \
              2>&1 | tee "$RUNNER_TEMP/s11-evidence/${dag_id}.log"
          done

      - name: Ghi bằng chứng DAG run (machine-readable)
        working-directory: backend
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow-home
          AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/infra/airflow/dags
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          set -e
          "$RUNNER_TEMP/airflow-runtime/bin/python" - <<'PY'
          import ast
          import json
          import os
          import sys
          from pathlib import Path

          import airflow

          dags_dir = Path(os.environ["GITHUB_WORKSPACE"]) / "infra" / "airflow" / "dags"
          sys.path.insert(0, str(dags_dir))

          # (1) Kiểm tra AST từng file DAG (hợp nhất hướng của `main`):
          #     file phải parse được VÀ gán đối tượng `dag` ở cấp module —
          #     hỗ trợ cả `dag = DAG(...)` lẫn `with DAG(...) as dag:`.
          dag_results = {}
          for dag_file in sorted(dags_dir.glob("*.py")):
              if dag_file.name.startswith("_") or dag_file.name.startswith("."):
                  continue
              source = dag_file.read_text(encoding="utf-8")
              tree = ast.parse(source)  # SyntaxError => step fail (fail-closed)
              names = set()
              for node in ast.walk(tree):
                  if isinstance(node, ast.Assign):
                      names.update(t.id for t in node.targets if isinstance(t, ast.Name))
                  elif isinstance(node, (ast.With, ast.AsyncWith)):
                      for item in node.items:
                          if isinstance(item.optional_vars, ast.Name):
                              names.add(item.optional_vars.id)
              if "dag" not in names:
                  raise SystemExit(f"{dag_file.name} khong gan doi tuong `dag` o cap module")
              dag_results[dag_file.name] = True

          # (2) Thông tin DAG THẬT lấy từ Airflow runtime (giá trị của branch).
          import inventory_ingestion as dag_module

          dag = dag_module.dag
          # Airflow 2.x: schedule_interval; Airflow 3.x: schedule.
          schedule = getattr(dag, "schedule", None)
          if schedule is None:
              schedule = getattr(dag, "schedule_interval", None)
          payload = {
              "dag_results": dag_results,
              "dag_id": dag.dag_id,
              "tasks": sorted(dag.task_ids),
              "task_count": len(dag.task_ids),
              "catchup": dag.catchup,
              "max_active_runs": dag.max_active_runs,
              "schedule": str(schedule),
              "airflow_version": airflow.__version__,
              "sha": os.environ.get("GITHUB_SHA", ""),
          }
          out = Path(os.environ["RUNNER_TEMP"]) / "s11-evidence" / "dag-run.json"
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(out.read_text(encoding="utf-8"))
          PY

      - name: Run ML Training
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          MLFLOW_TRACKING_URI: "sqlite:///${{ runner.temp }}/mlflow-s11/mlflow.db"
          QLK_INGEST_MLFLOW_TRACKING_URI: "sqlite:///${{ runner.temp }}/mlflow-s11/mlflow.db"
          QLK_INGEST_MLFLOW_ARTIFACT_DIR: "${{ runner.temp }}/mlflow-s11/mlruns"
          MODEL_NAME: "DemandForecastModel"
        run: poetry run pytest tests/test_ml_training.py tests/test_ml_registry.py -v --no-header --tb=short

      - name: Promote model to Production
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          MLFLOW_TRACKING_URI: "sqlite:///${{ runner.temp }}/mlflow-s11/mlflow.db"
          MODEL_NAME: "DemandForecastModel"
        run: |
          set -euo pipefail
          echo "=== Promoting model to Production (R² gate) ==="
          poetry run python scripts/promote_model_cli.py

      - name: MLflow registry gate (fail-closed)
        working-directory: backend
        env:
          MLFLOW_TRACKING_URI: "sqlite:///${{ runner.temp }}/mlflow-s11/mlflow.db"
          MODEL_NAME: "DemandForecastModel"
          E2E_EVIDENCE_PATH: "${{ runner.temp }}/s11-evidence/e2e-registry.json"
        run: poetry run python scripts/e2e_verify.py

      - name: FastAPI Serving Smoke Test
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
          MLFLOW_TRACKING_URI: "sqlite:///${{ runner.temp }}/mlflow-s11/mlflow.db"
          # `scripts/smoke_test.py` nằm ở GỐC repo; nó import `app.*` ⇒ cần
          # backend trên PYTHONPATH.
          PYTHONPATH: ${{ github.workspace }}/backend
          MODEL_NAME: "DemandForecastModel"
        run: |
          echo "=== FastAPI Serving Smoke Test ==="
          poetry run python "$GITHUB_WORKSPACE/scripts/smoke_test.py"

      - name: Drift Detection Check
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: poetry run pytest tests/test_drift_detection.py tests/test_e2e_verify.py -v --no-header --tb=short

      - name: E2E Verification Summary
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.CI_DATABASE_URL }}
        run: |
          echo "=== S11 machine-readable evidence ==="
          cat "$RUNNER_TEMP/s11-evidence/dag-run.json"
          cat "$RUNNER_TEMP/s11-evidence/e2e-registry.json"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pipeline-artifacts
          path: |
            ${{ runner.temp }}/s11-evidence/
            ${{ runner.temp }}/mlflow-s11/
          retention-days: 30

      # NOTE: step này CHỈ được chạy khi mọi step trước đó xanh. Trước đây nó
      # dùng `if: always()` ⇒ log in ra "S11 CLOUD CI E2E VERIFIED" ngay cả khi
      # job FAIL, tự mâu thuẫn với bằng chứng. Giờ: xanh ⇒ thông báo VERIFIED;
      # đỏ ⇒ thông báo FAILED ở step riêng.
      - name: Announce CLOUD_CI_E2E_VERIFIED
        if: success()
        run: |
          echo "========================================"
          echo "S11 CLOUD CI E2E VERIFIED"
          echo "Run: ${{ github.run_id }}"
          echo "SHA: ${{ github.sha }}"
          echo "Status: ${{ job.status }}"
          echo "========================================"

      - name: Announce CLOUD_CI_E2E_FAILED
        if: failure()
        run: |
          echo "========================================"
          echo "S11 CLOUD CI E2E FAILED"
          echo "Run: ${{ github.run_id }}"
          echo "SHA: ${{ github.sha }}"
          echo "Status: ${{ job.status }}"
          echo "========================================"

      - name: Export gate result
        id: gate-result
        if: success()
        run: |
          echo "gate=cloud_ci_e2e_verified" >> $GITHUB_OUTPUT
