name: Manual AKS Image Publication

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH_AKS_IMAGES to publish immutable images after CI'
        required: true
        type: string

env:
  PYTHON_VERSION: "3.11"
  FLUTTER_VERSION: "3.47.7"
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/bankops-api
  FRONTEND_IMAGE_NAME: ${{ github.repository_owner }}/bankops-frontend

jobs:
  # =========================================================================
  # 1. Quality & Security Gates
  # =========================================================================
  test:
    name: Lint, Test & Secret Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bankops
          POSTGRES_PASSWORD: bankops
          # Test data is isolated from the developer/demo database.
          POSTGRES_DB: bankops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bankops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Secret Guard
        # Fails the job (exit 1) on any `fail`-severity finding in tracked files.
        run: python3 scripts/check_no_secrets.py

      - name: Assert no real .env file is tracked
        # Allowlist: `*.env.example` / `.env.sample` / `.env.template`.
        run: |
          tracked_envs="$(git ls-files | grep -E '(^|/)\.env($|\.)' \
            | grep -Ev '\.env\.(example|sample|template)$' || true)"
          if [ -n "$tracked_envs" ]; then
            echo "::error::Tracked environment file(s) must not be committed:"
            printf '%s\n' "$tracked_envs"
            exit 1
          fi
          echo "No tracked .env files."

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Lint Backend (Ruff)
        run: |
          pip install "ruff==0.17.0"
          ruff check backend/

      - name: Install Backend Dependencies & Run Pytest
        run: |
          pip install poetry poetry-plugin-export
          cd backend
          poetry export -o requirements.txt --without-hashes --with dev
          pip install -r requirements.txt
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test" alembic upgrade head
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test" pytest tests/ -v

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Analyze & Test Frontend
        working-directory: frontend
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

  # =========================================================================
  # 2. Immutable Container Image Build & Security Scan
  # =========================================================================
  build-and-push:
    name: Build & Push Images
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLISH_AKS_IMAGES'
    environment: aks-promotion-manual
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.vars.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Image Tag
        id: vars
        run: |
          TAG="sha-${GITHUB_SHA}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Backend API Image
        id: api-build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Frontend Image
        id: frontend-build
        uses: docker/build-push-action@v5
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Security Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          format: 'table'
          exit-code: '0' # Log warnings without breaking demo build; set to 1 for strict compliance
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Record immutable publication digests
        run: |
          printf 'API: `%s@%s`\n' "${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}" "${{ steps.api-build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          printf 'Frontend: `%s@%s`\n' "${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}" "${{ steps.frontend-build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
