name: Deploy QuanLyKho API

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/quanlykho-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ github.sha }}
      - name: Extract sha tag for deploy
        id: sha-tag
        run: |
          # metadata-action outputs tags like "sha-abc1234" and full sha
          # We need the full sha tag for deploy consistency
          echo "sha_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure-container-apps:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.AZURE_CLIENT_ID != ''
    permissions:
      contents: read
      # OIDC federation requires the workflow to mint an OIDC token; azure/login
      # exchanges it with Entra ID. Vault-issued JSON creds (AZURE_CREDENTIALS)
      # must NOT be used — create the App Registration's federated credential
      # with issuer https://token.actions.githubusercontent.com instead.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        # No static service-principal secret: authenticate via workload identity
        # federation using the three OIDC secrets below (no client secret).
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: quanlykho-api
          image: ghcr.io/${{ github.repository }}/quanlykho-api:${{ steps.sha-tag.outputs.sha_tag }}
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          envVars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            JWT_SIGNING_KEY=${{ secrets.BANKOPS_SIGNING_KEY }}
            JWT_ALGORITHM=HS256
            CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
            CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
            BANKOPS_SESSION_SECRET=${{ secrets.BANKOPS_SESSION_SECRET }}
            BANKOPS_SIGNING_KEY=${{ secrets.BANKOPS_SIGNING_KEY }}
            APP_ENV=production
            DEMO_MODE=false
