name: Deploy QuanLyKho API

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_LEGACY_ACA to build and deploy the legacy Container App'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/quanlykho-api

jobs:
  check-env:
    name: Check deployment credentials
    runs-on: ubuntu-latest
    outputs:
      has_credentials: ${{ steps.check.outputs.has_credentials }}
    steps:
      - name: Check Azure credentials
        id: check
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "has_credentials=true" >> $GITHUB_OUTPUT
            echo "Azure credentials present."
          else
            echo "has_credentials=false" >> $GITHUB_OUTPUT
            echo "::notice title=Azure Deploy Disabled::AZURE_CLIENT_ID secret not configured in repository. Downstream deploy job will be skipped."
          fi

  build-and-push:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY_LEGACY_ACA'
    runs-on: ubuntu-latest
    environment: legacy-aca-manual
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.sha-tag.outputs.sha_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=${{ github.sha }}
      - name: Extract sha tag for deploy
        id: sha-tag
        run: |
          # metadata-action outputs tags like "sha-abc1234" and full sha
          # We need the full sha tag for deploy consistency
          echo "sha_tag=${{ github.sha }}" >> $GITHUB_OUTPUT
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-azure-container-apps:
    name: Deploy to Azure Container Apps
    needs: [build-and-push, check-env]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY_LEGACY_ACA' && needs.check-env.outputs.has_credentials == 'true'
    environment: legacy-aca-manual
    permissions:
      contents: read
      # OIDC federation requires the workflow to mint an OIDC token; azure/login
      # exchanges it with Entra ID. Vault-issued JSON creds (AZURE_CREDENTIALS)
      # must NOT be used — create the App Registration's federated credential
      # with issuer https://token.actions.githubusercontent.com instead.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Azure Login (OIDC)
        # No static service-principal secret: authenticate via workload identity
        # federation using the three OIDC secrets below (no client secret).
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch application secrets from Azure Key Vault
        id: kv-secrets
        run: |
          KV=kv-aks-sre-platform-dev
          DB_URL=$(az keyvault secret show --vault-name "$KV" --name bankops-secrets-database-url --query value -o tsv)
          JWT_KEY=$(az keyvault secret show --vault-name "$KV" --name bankops-secrets-bankops-signing-key --query value -o tsv)
          CF_TOKEN=$(az keyvault secret show --vault-name "$KV" --name bankops-secrets-cloudflare-api-token --query value -o tsv)
          CF_ACCOUNT=$(az keyvault secret show --vault-name "$KV" --name bankops-secrets-cloudflare-account-id --query value -o tsv)
          SMTP_PASS=$(az keyvault secret show --vault-name "$KV" --name bankops-secrets-smtp-password --query value -o tsv)
          SESSION_SECRET=$(az keyvault secret show --vault-name "$KV" --name bankops-secrets-bankops-session-secret --query value -o tsv)
          echo "database_url=$DB_URL" >> "$GITHUB_OUTPUT"
          echo "jwt_signing_key=$JWT_KEY" >> "$GITHUB_OUTPUT"
          echo "cloudflare_api_token=$CF_TOKEN" >> "$GITHUB_OUTPUT"
          echo "cloudflare_account_id=$CF_ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "smtp_password=$SMTP_PASS" >> "$GITHUB_OUTPUT"
          echo "bankops_session_secret=$SESSION_SECRET" >> "$GITHUB_OUTPUT"
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP }}
          containerAppName: quanlykho-api
          image: ghcr.io/${{ github.repository }}/quanlykho-api:${{ needs.build-and-push.outputs.sha_tag }}
          registryUrl: ghcr.io
          registryUsername: ${{ github.actor }}
          registryPassword: ${{ secrets.GITHUB_TOKEN }}
          envVars: |
            DATABASE_URL=${{ steps.kv-secrets.outputs.database_url }}
            JWT_SIGNING_KEY=${{ steps.kv-secrets.outputs.jwt_signing_key }}
            JWT_ALGORITHM=HS256
            CLOUDFLARE_API_TOKEN=${{ steps.kv-secrets.outputs.cloudflare_api_token }}
            CLOUDFLARE_ACCOUNT_ID=${{ steps.kv-secrets.outputs.cloudflare_account_id }}
            SMTP_PASSWORD=${{ steps.kv-secrets.outputs.smtp_password }}
            LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
            LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
            BANKOPS_SESSION_SECRET=${{ steps.kv-secrets.outputs.bankops_session_secret }}
            BANKOPS_SIGNING_KEY=${{ steps.kv-secrets.outputs.jwt_signing_key }}
            APP_ENV=production
            DEMO_MODE=false
