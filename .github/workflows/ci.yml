name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  secret-guard:
    name: Secret Guard (fails on any credential in tracked files)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed secrets
        # Exit 1 on any `fail`-severity finding -> the job fails and blocks the
        # pipeline. `warn`-severity findings (dev/demo Postgres URLs with an
        # inline password) are advisory and are NOT blocking; see the allowlist
        # in scripts/check_no_secrets.py.
        run: python3 scripts/check_no_secrets.py
      - name: Assert no real .env file is tracked
        # Belt-and-braces: a committed `.env` / `.env.production` is a leaked
        # secret file even when the scanner happens to miss a value in it.
        # Allowlist: `*.env.example` / `.env.sample` / `.env.template`
        # (placeholder templates only).
        run: |
          tracked_envs="$(git ls-files | grep -E '(^|/)\.env($|\.)' \
            | grep -Ev '\.env\.(example|sample|template)$' || true)"
          if [ -n "$tracked_envs" ]; then
            echo "::error::Tracked environment file(s) must not be committed:"
            printf '%s\n' "$tracked_envs"
            exit 1
          fi
          echo "No tracked .env files."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Ruff and workflow parser
        # Pin đúng version đã fix hết cảnh báo — ruff mới thường thêm rule mới
        # (vd 0.17.0 bắt I001/UP041 mà 0.16 không). Muốn nâng thì bump có chủ đích.
        run: pip install "ruff==0.17.0" "PyYAML==6.0.3"
      - name: Lint
        run: ruff check backend/
      - name: Guard release workflows against automatic promotion
        run: python3 -m unittest scripts.test_release_workflow_gates scripts.test_tested_image_artifact -v

  test:
    runs-on: ubuntu-latest
    # Demo mode is opt-in and explicit: app.config.Settings.app_env defaults to
    # "production" (fail-closed), and in production mode init_db() neither
    # creates the schema nor seeds, while seed_demo() raises
    # "seed_demo is blocked in production."  The suite runs against demo data
    # (demo_maker / demo_checker / demo_admin ...), so the job must say so.
    env:
      APP_ENV: demo
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bankops
          POSTGRES_PASSWORD: bankops
          # This is deliberately not the developer/demo database.  The
          # pytest session guard rejects non-test database names.
          POSTGRES_DB: bankops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bankops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Record the exact commit under test
        run: |
          SHA="$(git rev-parse HEAD)"
          {
            echo "### Tested commit"
            echo "\`${SHA}\`"
            echo "commit=${SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry==2.5.1 poetry-plugin-export==1.10.1
      - name: Install dependencies
        run: |
          cd backend
          # --with dev: pytest/ruff nằm trong group dev — thiếu thì CI chết vì
          # "pytest: command not found" ngay sau khi install thành công.
          poetry export -o requirements.txt --without-hashes --with dev
          pip install -r requirements.txt
      - name: Run migration
        run: |
          cd backend
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test" alembic upgrade head
      - name: Seed the test database
        run: |
          cd backend
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test" python -m app.seed
      - name: Run tests
        run: |
          cd backend
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test" pytest tests/ -v --cov=app --cov-report=xml:coverage.xml
      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.47.7 khớp deploy.yml và máy dev — pubspec.lock đã resolve với
          # Dart mới; Flutter 3.24 (Dart 3.5) không resolve được pdf ^3.12.0.
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true
      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get
      - name: Flutter analyze
        working-directory: frontend
        # --no-fatal-infos --no-fatal-warnings: chỉ chặn error; info style không làm fail build.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter test
        working-directory: frontend
        run: flutter test
      - name: Build Flutter Web
        working-directory: frontend
        run: flutter build web --release

  worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/cloudflare-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: [secret-guard, lint, test, frontend-web, worker-typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t bankops-api:latest backend/
      - name: Validate compose
        run: docker compose config
      - name: Verify build
        run: echo "Docker build successful"

  sonar-scan:
    name: SonarQube scan
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      APP_ENV: demo
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bankops
          POSTGRES_PASSWORD: bankops
          # Deliberately not the developer/demo database; the pytest session
          # guard rejects non-test database names.
          POSTGRES_DB: bankops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bankops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21 for SonarScanner
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry==2.5.1 poetry-plugin-export==1.10.1
      - name: Install dependencies (Poetry dev toolchain)
        # pytest-cov and ruff live in [tool.poetry.group.dev.dependencies]
        working-directory: backend
        run: |
          poetry export -o requirements.txt --without-hashes --with dev
          pip install -r requirements.txt
      - name: Run migration
        working-directory: backend
        run: |
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test" alembic upgrade head
      - name: Seed the test database
        working-directory: backend
        run: |
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test" python -m app.seed
      - name: Run tests with coverage
        # backend/app is the backend package under backend/
        working-directory: backend
        run: |
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test" poetry run pytest tests --cov=app --cov-report=xml
      - name: Lint with ruff (Poetry)
        working-directory: backend
        run: poetry run ruff check .
      - name: Validate SonarCloud token
        run: |
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error::SONAR_TOKEN is unset or empty. Recreate and configure the GitHub secret before running SonarQube/SonarCloud."
            exit 1
          fi
      - name: SonarQube scan
        run: |
          set -euxo pipefail
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip \
            -o sonar-scanner.zip
          unzip -q sonar-scanner.zip
          sed -i 's/^use_embedded_jre=true/use_embedded_jre=false/' "$PWD/sonar-scanner-5.0.1.3006-linux/bin/sonar-scanner"
          export PATH="${JAVA_HOME}/bin:$PWD/sonar-scanner-5.0.1.3006-linux/bin:${PATH}"
          sonar-scanner \
            -Dsonar.projectKey=imtarget05_BankOps \
            -Dsonar.organization=imtarget05 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.automaticAnalysis=false \
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: Trivy filesystem scan (vuln/secret/misconfig)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          ignore-unfixed: true
          format: 'table'
          output: trivy-fs-results.txt
      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-fs-results
          path: trivy-fs-results.txt
          retention-days: 7

  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: |
          docker build -t bankops-api:ci ./backend
      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image: 'bankops-api:ci'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          output: trivy-image-results.txt
      - name: Upload Trivy image results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-image-results
          path: trivy-image-results.txt
          retention-days: 7

  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLEAKS_CONFIG: .gitleaks.toml

  pip-audit:
    name: Python dependency audit (pip-audit)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pip-audit
        run: python -m pip install --only-binary ':all:' pip-audit==2.10.1
      - name: Audit backend dependencies
        working-directory: backend
        run: |
          pip install poetry==2.5.1 poetry-plugin-export==1.10.1
          poetry export --without-hashes --with dev -o /tmp/requirements-all.txt
          pip-audit -r /tmp/requirements-all.txt --progress-spinner off

  npm-audit:
    name: npm dependency audit (MCP/Cloudflare worker)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - name: Install Cloudflare worker deps
        working-directory: infra/cloudflare-worker
        run: npm ci --ignore-scripts || true
      - name: npm audit
        working-directory: infra/cloudflare-worker
        run: npm audit --audit-level=high || true

  sbom:
    name: Generate SBOM (Syft)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Run Syft SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          output-file: sbom.spdx.json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-bankops-api
          path: sbom.spdx.json
          retention-days: 30

  cosign-sign:
    name: Cosign sign container image
    runs-on: ubuntu-latest
    needs: [build, trivy-image, sbom]
    steps:
      - uses: actions/checkout@v4
      - name: Check Cosign key
        id: cosign-check
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
        run: |
          if [ -n "$COSIGN_KEY" ]; then
            echo "has_cosign=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cosign=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COSIGN_KEY secret not configured. Container signing skipped."
          fi
      - name: Install Cosign
        if: steps.cosign-check.outputs.has_cosign == 'true'
        uses: sigstore/cosign-installer@v3.5.0
      - name: Sign image with Cosign
        if: steps.cosign-check.outputs.has_cosign == 'true'
        run: |
          IMAGE_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' bankops-api:ci | cut -d@ -f2)"
          echo "${COSIGN_PASSWORD}" | cosign login ghcr.io -u imtarget05 --password-stdin
          cosign sign --key="${COSIGN_KEY}" --yes "ghcr.io/imtarget05/bankops-api@${IMAGE_DIGEST}"
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}
      - name: Verify signature
        if: steps.cosign-check.outputs.has_cosign == 'true'
        run: |
          IMAGE_DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' bankops-api:ci | cut -d@ -f2)"
          cosign verify --key="${COSIGN_KEY}" "ghcr.io/imtarget05/bankops-api@${IMAGE_DIGEST}"
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_KEY }}

  k6-load-test:
    name: k6 load testing
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 load test
        uses: grafana/k6-action@v0.4.0
        with:
          filename: tests/load/k6/inventory-load-test.js
        env:
          API_URL: http://localhost:8000

  live-ai-eval:
    name: Live AI eval (golden dataset + LLM-as-judge)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry==2.5.1 poetry-plugin-export==1.10.1
      - name: Install dependencies
        working-directory: backend
        run: |
          poetry export -o requirements.txt --without-hashes --with dev
          pip install -r requirements.txt
      - name: Run live AI eval
        working-directory: backend
        run: |
          MLFLOW_TRACKING_URI="sqlite:///./mlflow.db" python -m app.services.live_eval
        env:
          AI_JUDGE_ENDPOINT: ${{ secrets.AI_JUDGE_ENDPOINT }}

  terraform-plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infra/terraform
        run: terraform validate
      - name: Terraform plan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        if: env.ARM_CLIENT_ID != ''
        working-directory: infra/terraform
        run: terraform plan -var-file=environments/dev/terraform.tfvars

  helm-lint:
    name: Helm lint + unit test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0
      - name: Helm lint
        run: helm lint infra/helm/bankops
      - name: Helm template render (dry-run)
        run: |
          helm template bankops infra/helm/bankops \
            -f infra/helm/bankops/values-dev.yaml \
            -n quanlykho-dev > /dev/null

  kubeconform:
    name: Kubeconform manifest validation
    runs-on: ubuntu-latest
    needs: [helm-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up kubeconform
        run: |
          curl -L https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform
      - name: Render and validate manifests
        run: |
          helm template bankops infra/helm/bankops \
            -f infra/helm/bankops/values-dev.yaml \
            -n quanlykho-dev > /tmp/rendered.yaml
          kubeconform -kubernetes-version 1.28.0 /tmp/rendered.yaml
