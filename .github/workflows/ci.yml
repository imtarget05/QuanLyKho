name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  secret-guard:
    name: Secret Guard (fails on any credential in tracked files)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed secrets
        # Exit 1 on any `fail`-severity finding -> the job fails and blocks the
        # pipeline. `warn`-severity findings (dev/demo Postgres URLs with an
        # inline password) are advisory and are NOT blocking; see the allowlist
        # in scripts/check_no_secrets.py.
        run: python3 scripts/check_no_secrets.py
      - name: Assert no real .env file is tracked
        # Belt-and-braces: a committed `.env` / `.env.production` is a leaked
        # secret file even when the scanner happens to miss a value in it.
        # Allowlist: `*.env.example` / `.env.sample` / `.env.template`
        # (placeholder templates only).
        run: |
          tracked_envs="$(git ls-files | grep -E '(^|/)\.env($|\.)' \
            | grep -Ev '\.env\.(example|sample|template)$' || true)"
          if [ -n "$tracked_envs" ]; then
            echo "::error::Tracked environment file(s) must not be committed:"
            printf '%s\n' "$tracked_envs"
            exit 1
          fi
          echo "No tracked .env files."

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Ruff and workflow parser
        # Pin đúng version đã fix hết cảnh báo — ruff mới thường thêm rule mới
        # (vd 0.17.0 bắt I001/UP041 mà 0.16 không). Muốn nâng thì bump có chủ đích.
        run: pip install "ruff==0.17.0" "PyYAML==6.0.3"
      - name: Lint
        run: ruff check backend/
      - name: Guard release workflows against automatic promotion
        run: python3 -m unittest scripts.test_release_workflow_gates scripts.test_tested_image_artifact -v

  test:
    runs-on: ubuntu-latest
    # Demo mode is opt-in and explicit: app.config.Settings.app_env defaults to
    # "production" (fail-closed), and in production mode init_db() neither
    # creates the schema nor seeds, while seed_demo() raises
    # "seed_demo is blocked in production."  The suite runs against demo data
    # (demo_maker / demo_checker / demo_admin ...), so the job must say so.
    env:
      APP_ENV: demo
      DEMO_MODE: "true"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bankops
          POSTGRES_PASSWORD: bankops
          # This is deliberately not the developer/demo database.  The
          # pytest session guard rejects non-test database names.
          POSTGRES_DB: bankops_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bankops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Record the exact commit under test
        run: |
          SHA="$(git rev-parse HEAD)"
          {
            echo "### Tested commit"
            echo "\`${SHA}\`"
            echo "commit=${SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Poetry
        run: pip install poetry==2.5.1 poetry-plugin-export==1.10.1
      - name: Install dependencies
        run: |
          cd backend
          # --with dev: pytest/ruff nằm trong group dev — thiếu thì CI chết vì
          # "pytest: command not found" ngay sau khi install thành công.
          poetry export -o requirements.txt --without-hashes --with dev
          pip install -r requirements.txt
      - name: Run migration
        run: |
          cd backend
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test" alembic upgrade head
      - name: Seed the test database
        run: |
          cd backend
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test" python -m app.seed
      - name: Run tests
        run: |
          cd backend
          DATABASE_URL="postgresql+psycopg2://bankops:bankops@localhost:5432/bankops_test" pytest tests/ -v

  frontend-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 3.47.7 khớp deploy.yml và máy dev — pubspec.lock đã resolve với
          # Dart mới; Flutter 3.24 (Dart 3.5) không resolve được pdf ^3.12.0.
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true
      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get
      - name: Flutter analyze
        working-directory: frontend
        # --no-fatal-infos --no-fatal-warnings: chỉ chặn error; info style không làm fail build.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Flutter test
        working-directory: frontend
        run: flutter test
      - name: Build Flutter Web
        working-directory: frontend
        run: flutter build web --release

  worker-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cloudflare-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/cloudflare-worker/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run typecheck

  build:
    runs-on: ubuntu-latest
    needs: [secret-guard, lint, test, frontend-web, worker-typecheck]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f backend/Dockerfile -t bankops-api:latest backend/
      - name: Validate compose
        run: docker compose config
      - name: Verify build
        run: echo "Docker build successful"

  sonar:
    name: SonarCloud scan
    runs-on: ubuntu-latest
    needs: [lint, test, frontend-web, worker-typecheck]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        run: |
          curl -fsSL --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip \
            -o sonar-scanner.zip
          unzip -q sonar-scanner.zip
          PATH="$PATH:$PWD/sonar-scanner-5.0.1.3006-linux/bin"
          export PATH
          sonar-scanner \
            -Dsonar.projectKey=QuanLyKho \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.python.coverage.reportPaths=coverage.xml \
            -Dsonar.python.xunit.reportPaths=test-results.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip SonarCloud scan when token is not configured
        if: env.SONAR_TOKEN == ''
        run: echo "Skipping SonarCloud scan until SONAR_TOKEN is configured."
