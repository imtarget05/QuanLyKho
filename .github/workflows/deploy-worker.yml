name: Validate legacy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-legacy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate legacy Worker source
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: infra/cloudflare-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: infra/cloudflare-worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Document non-production status
        run: |
          echo "Cloudflare Worker is legacy/compatibility source only."
          echo "FastAPI is the canonical production API; this workflow never deploys Worker."
