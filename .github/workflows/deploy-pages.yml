name: Build & Deploy Quản Lý Kho Trà Sữa

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DEPLOY_CLOUDFLARE_ASSETS to publish Flutter Web'
        required: true
        type: string

concurrency:
  group: deploy-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # Canonical API FastAPI qua Cloudflare Worker Reverse Proxy
  API_BASE_URL: "https://kho-tra-sua-api.tanmainguyenbinh.workers.dev/api/v1"

jobs:
  build-and-deploy:
    name: Build Flutter Web & Deploy
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY_CLOUDFLARE_ASSETS'
    environment: cloudflare-assets-manual
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secrets are configured
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          for v in GOOGLE_CLIENT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Secret ${v} chưa cấu hình (Settings → Secrets and variables → Actions)"
              missing=1
            fi
          done
          exit $missing

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Khớp deploy.yml + máy dev (3.24 không resolve được pdf ^3.12.0).
          flutter-version: "3.47.7"
          channel: "stable"
          cache: true

      - name: Flutter pub get
        working-directory: frontend
        run: flutter pub get

      - name: Flutter analyze
        working-directory: frontend
        # --no-fatal-infos --no-fatal-warnings: chỉ chặn error; info style không làm fail build.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Flutter test
        working-directory: frontend
        run: flutter test

      - name: Build Flutter Web (release)
        working-directory: frontend
        env:
          # FastAPI trên Modal (xem `env.API_BASE_URL` ở đầu workflow).
          API_BASE_URL: ${{ env.API_BASE_URL }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "Building Web with commit SHA: ${SHORT_SHA} at ${BUILD_TIME}"
          flutter build web \
            --release \
            --tree-shake-icons \
            --build-number="${SHORT_SHA}" \
            --build-name="0.1.0" \
            --dart-define=APP_BUILD_COMMIT="${SHORT_SHA}" \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --dart-define=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --dart-define=APP_ENV=production

          cat <<EOF > build/web/version.json
          {
            "app_name": "kho_tra_sua",
            "version": "0.1.0",
            "build_number": "${SHORT_SHA}",
            "build_time": "${BUILD_TIME}",
            "package_name": "kho_tra_sua"
          }
          EOF


      - name: Deploy to Cloudflare Workers Assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Worker Assets sử dụng SPA fallback từ wrangler.tea-inventory.toml.
          # Không copy _redirects: Workers Assets không hỗ trợ redirect legacy.
          rm -rf frontend/build/worker-assets
          rsync -a --exclude='_redirects' frontend/build/web/ frontend/build/worker-assets/
          cp infra/cloudflare-pages/_headers frontend/build/worker-assets/_headers
          npx --yes wrangler@4 deploy --config infra/cloudflare-worker/wrangler.tea-inventory.toml

      - name: Smoke test (API health from deployed bundle)
        run: |
          # Backend tạm nghỉ (Modal) → API_BASE_URL rỗng thì bỏ qua smoke test.
          if [ -z "${{ env.API_BASE_URL }}" ]; then
            echo "API_BASE_URL chưa cấu hình — bỏ qua smoke test backend."
            exit 0
          fi
          TARGET_URL="${{ env.API_BASE_URL }}"
          TARGET_URL="${TARGET_URL%/}"
          if [[ "$TARGET_URL" != */api/v1 ]]; then
            TARGET_URL="${TARGET_URL}/api/v1"
          fi
          curl -fsS -m 90 "${TARGET_URL}/health/live" | grep -q '"status":"alive"'
          echo "Backend health OK: ${TARGET_URL}"

      - name: Print deployment URL
        run: |
          echo "✅ Flutter Web deployed to Cloudflare Workers Assets"
          echo "🌐 URL: https://quan-ly-kho-tra-sua.tanmainguyenbinh.workers.dev"
