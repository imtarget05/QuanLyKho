# =============================================================================
# QuanLyKho — Helm chart default values
# =============================================================================
# Real values are sourced from the repo's existing raw manifests:
#   - infra/k8s/base/deployment-api.yaml  (resources, probes, securityContext)
#   - infra/k8s/base/configmap.yaml       (non-secret env vars)
#   - infra/k8s/base/ingress.yaml         (ingress annotations)
#   - infra/k8s/base/migration-job.yaml   (alembic upgrade head)
#   - .github/workflows/deploy.yml        (image reference)
#
# SECRETS ARE NEVER SET HERE. The backend reads DATABASE_URL, REDIS_URL,
# BANKOPS_SIGNING_KEY, BANKOPS_SESSION_SECRET, SMTP_USER, SMTP_PASSWORD,
# CLOUDFLARE_API_TOKEN, ... from an external Kubernetes Secret that must be
# provisioned per-cluster (SealedSecrets / External Secrets / kubectl).
# =============================================================================

# Backend container image (built by CI "build" job from the repo-root Dockerfile).
image:
  repository: ghcr.io/imtarget05/quanlykho/quanlykho-api
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# ---------------------------------------------------------------------------
# Service account
# ---------------------------------------------------------------------------
serviceAccount:
  create: true
  annotations: {}
  # Leave empty to auto-generate "<fullname>".
  name: ""

# ---------------------------------------------------------------------------
# Backend deployment
# ---------------------------------------------------------------------------
replicaCount: 2

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

backend:
  containerPort: 8000
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Same request/limit envelope as infra/k8s/base/deployment-api.yaml.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # Health endpoints (backend/app/main.py): /api/v1/health/live, /api/v1/health/ready
  livenessProbe:
    httpGet:
      path: /api/v1/health/live
      port: http
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    httpGet:
      path: /api/v1/health/ready
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2

# ---------------------------------------------------------------------------
# Non-secret environment variables (rendered into the Deployment `env`).
# Secret variables (DATABASE_URL, REDIS_URL, BANKOPS_SIGNING_KEY, SMTP_*, ...)
# are injected through envFrom secretRef below — NEVER put values here.
# ---------------------------------------------------------------------------
env:
  APP_ENV: "production"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  AI_PROVIDER: "cloudflare"
  CLOUDFLARE_MODEL: "@cf/meta/llama-3.1-8b-instruct"
  # JSON list as expected by backend/app/config.py ALLOWED_ORIGINS.
  ALLOWED_ORIGINS: '["https://quanlykho.internal"]'
  # Trust ingress-controller source IPs for X-Forwarded-For (rate limiting).
  FORWARDED_ALLOW_IPS: "10.0.0.0/8"

# Reference to a pre-provisioned Secret holding all secret env vars.
# Required keys (see infra/k8s/base/secret-template.yaml for the full list):
#   DATABASE_URL, REDIS_URL, BANKOPS_SIGNING_KEY, BANKOPS_SESSION_SECRET,
#   SMTP_USER, SMTP_PASSWORD, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN
secrets:
  # Existing Secret object name. The chart does NOT create it.
  existingSecret: "quanlykho-secrets"

# ---------------------------------------------------------------------------
# Service
# ---------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8000

# ---------------------------------------------------------------------------
# Horizontal Pod Autoscaler (staging/prod enable this in their overlays)
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

# ---------------------------------------------------------------------------
# Ingress (nginx ingress class, same annotations as infra/k8s/base/ingress.yaml)
# ---------------------------------------------------------------------------
ingress:
  enabled: true
  className: nginx
  # PLACEHOLDER — set the real cluster ingress host per environment overlay
  # (values-dev / values-staging / values-prod) or via --set ingress.host.
  host: quanlykho.example.com
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: true
    secretName: quanlykho-tls-cert
  # Routes matched by infra/k8s/base/ingress.yaml — API + health + docs.
  paths:
    - path: /api/
      pathType: Prefix
    - path: /health/
      pathType: Prefix
    - path: /docs
      pathType: Prefix
    - path: /redoc
      pathType: Prefix
    - path: /openapi.json
      pathType: Exact

# ---------------------------------------------------------------------------
# Database migration job (Helm pre-install/pre-upgrade hook)
# Runs `alembic upgrade head` with the same backend image.
# ---------------------------------------------------------------------------
migrations:
  enabled: true
  backoffLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

# ---------------------------------------------------------------------------
# External dependency endpoints — placeholders only.
# This chart does NOT deploy PostgreSQL or Redis; both are external
# (managed cloud service or separately deployed StatefulSet).
# These URLs live in the external Secret (see `secrets.existingSecret`),
# not here. The entries below exist purely as documentation of the contract.
# ---------------------------------------------------------------------------
externalDatabase:
  # Example: postgresql+asyncpg://<user>:<password>@<host>:5432/<db>
  host: ""
externalRedis:
  # Example: redis://<host>:6379/0
  host: ""

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
