[tool.poetry]
name = "kho-tra-sua-backend"
version = "0.1.0"
description = "Kho Trà Sữa backend - FastAPI modular monolith for inventory and cash simulation"
authors = ["Kho Tra Sua Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.9.0"
alembic = "^1.13.0"
# SQLAlchemy is capped below 2.1 on purpose. mlflow 2.x imports
# `sqlalchemy.pool.FallbackAsyncAdaptedQueuePool` (mlflow/store/db/utils.py),
# and that name was REMOVED in SQLAlchemy 2.1. With 2.1.x installed, every
# test that touches mlflow dies at import time with
# "ImportError: cannot import name 'FallbackAsyncAdaptedQueuePool' from
# 'sqlalchemy.pool'". The caret range alone resolved to 2.1.4, so the cap has
# to be explicit. 2.0.43 is the newest 2.0.x and still exports the symbol.
sqlalchemy = ">=2.0.35,<2.1"
psycopg2-binary = "^2.9.9"
asyncpg = "^0.29.0"
pydantic-settings = "^2.5.0"
opentelemetry-api = "^1.25.0"
opentelemetry-sdk = "^1.25.0"
opentelemetry-exporter-otlp = "^1.25.0"
opentelemetry-instrumentation-fastapi = "^0.46b0"
opentelemetry-instrumentation-httpx = "^0.46b0"
opentelemetry-instrumentation-sqlalchemy = "^0.46b0"
opentelemetry-instrumentation-logging = "^0.46b0"
prometheus-client = "^0.21.0"
mlflow = "^2.10.0"
pandas = "^2.2.0"
scikit-learn = "^1.4.0"
setuptools = ">=80.9,<81"
joserfc = "^1.0.0"
authlib = "^1.3.0"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
bcrypt = "<4.1"
itsdangerous = "^2.1.0"
greenlet = "^3.0.0"
python-multipart = "^0.0.10"
python-dotenv = "^1.0.0"
httpx = "^0.27.0"
pyyaml = "^6.0.2"
redis = "^5.0.0"
google-auth = "^2.30.0"
requests = "^2.31.0"
langfuse = "^2.53.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
httpx = "^0.27.0"
alembic = "^1.13.0"
testcontainers = "^4.8.0"
    # Must stay in lockstep with CI: ci.yml:51 / ci-gitops.yml:77 pin
    # ruff==0.17.0. 0.17.0 adds I001-import-form / UP041 checks and reports
    # B033 duplicate-set-item, so a dev venv pinned lower reports different
    # findings than CI (the "UP038 at pagination.py:126" false positive was
    # exactly this mismatch: venv ruff 0.6.9 vs CI 0.17.0).
    ruff = "^0.17.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]
ignore = ["E501"]
# B008 flags FastAPI `Depends(...)` in defaults — idiomatic FastAPI, not a bug.
# Scoped per-file so genuine B008 elsewhere still fires.
per-file-ignores = { "app/api/routes/*.py" = ["B008"], "app/features/*/routes.py" = ["B008"], "app/database.py" = ["B008"] }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--cov=app",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=75",
    "-q",
]
