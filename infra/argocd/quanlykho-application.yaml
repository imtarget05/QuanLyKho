apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: quanlykho-production
  namespace: argocd
  labels:
    app.kubernetes.io/name: quanlykho-production
    app.kubernetes.io/part-of: quanlykho-system
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: portfolio
  source:
    repoURL: "https://github.com/imtarget05/QuanLyKho.git"
    targetRevision: main
    path: infra/k8s/overlays/production
  destination:
    server: "https://kubernetes.default.svc"
    namespace: quanlykho
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: bankops-frontend
      jsonPointers:
        - /spec/replicas
    - group: apps
      kind: Deployment
      name: cloudflare-tunnel
      jsonPointers:
        - /spec/replicas
    - group: batch
      kind: Job
      jsonPointers:
        - /spec/selector
        - /spec/template/metadata/labels/controller-uid
        - /spec/template/metadata/labels/batch.kubernetes.io~1controller-uid
