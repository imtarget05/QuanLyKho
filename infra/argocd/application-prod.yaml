apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bankops-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: bankops-portfolio
  source:
    repoURL: https://github.com/imtarget05/bankops.git
    targetRevision: HEAD
    path: infra/helm/bankops
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bankops
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - Replace=true
  revisionHistoryLimit: 10
