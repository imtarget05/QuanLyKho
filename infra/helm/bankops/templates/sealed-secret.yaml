{{- if .Values.sealedSecret.enabled -}}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "bankops.fullname" . }}-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    component: sealed-secret
spec:
  encryptedData:
{{- range $key, $value := .Values.secret.stringData }}
    {{ $key }}: "{{ $value }}"
{{- end }}
  template:
    metadata:
      name: {{ include "bankops.fullname" . }}-secrets
      namespace: {{ .Values.namespace }}
      labels:
        {{- include "bankops.labels" . | nindent 8 }}
        component: sealed-secret
    type: Opaque
{{- end }}