{{- if .Values.secret.enabled -}}
{{- $mode := default "raw" .Values.secret.mode -}}
{{- if eq $mode "raw" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bankops.fullname" . }}-secrets
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secret.stringData }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- if .Values.secret.data }}
data:
{{ toYaml .Values.secret.data | indent 4 }}
{{- end }}
{{- end }}
{{- end }}