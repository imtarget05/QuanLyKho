{{- if .Values.externalSecret.enabled -}}
---
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: bankops-secret-store
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    component: secret-store
spec:
  {{- if eq .Values.externalSecret.provider "awssm" }}
  provider:
    awssecretmanager:
      region: {{ .Values.externalSecret.region | default "ap-southeast-1" }}
      auth:
        secretRef:
          accessKeyID:
            name: cluster-aws-credentials
            key: accessKeyId
          secretAccessKey:
            name: cluster-aws-credentials
            key: secretAccessKey
  {{- else if eq .Values.externalSecret.provider "gcpsm" }}
  provider:
    gcpsm:
      projectId: {{ .Values.externalSecret.projectId | default "bankops-project" }}
      auth:
        secretRef:
          name: cluster-gcp-credentials
          key: serviceAccountJson
  {{- else }}
  provider:
    webhook:
      url: https://webhook.example.com/secrets
  {{- end }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: bankops-external-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    component: external-secret
spec:
  secretStoreRef:
    name: bankops-secret-store
    kind: SecretStore
  target:
    name: {{ include "bankops.fullname" . }}-secrets
    creationPolicy: Owner
    template:
      metadata:
        labels:
          {{- include "bankops.labels" . | nindent 10 }}
          component: external-secret
      type: Opaque
  data:
{{- $secretPath := .Values.externalSecret.secretPath | default "bankops" -}}
{{- range $key, $value := .Values.secret.stringData }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ $secretPath }}/{{ $key }}
{{- end }}
{{- end }}