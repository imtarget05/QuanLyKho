{{- if .Values.otel.collector.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bankops.fullname" . }}-otel-collector
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    component: otel-collector
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: prometheus
      port: 9464
      targetPort: 9464
      protocol: TCP
  selector:
    {{- include "bankops.selectorLabels" . | nindent 4 }}
    component: otel-collector
{{- end }}
