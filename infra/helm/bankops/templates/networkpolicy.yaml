{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "bankops.fullname" . }}-api-ingress
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bankops.name" . }}-api
      component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              component: monitor
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-collector
              component: otel-collector
      ports:
        - protocol: TCP
          port: {{ .Values.api.containerPort }}
{{- end }}