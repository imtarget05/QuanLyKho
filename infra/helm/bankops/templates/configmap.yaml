{{- if .Values.configmap.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bankops.fullname" . }}-config
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    app.kubernetes.io/component: config
data:
{{ toYaml .Values.configmap.data | indent 2 }}
{{- end }}
