{{- if .Values.frontend.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bankops.fullname" . }}-frontend
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ include "bankops.name" . }}-frontend
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.frontend.containerPort }}
      targetPort: 80
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "bankops.name" . }}-frontend
{{- end }}