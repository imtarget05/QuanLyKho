{{- if .Values.rollouts.enabled -}}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "bankops.fullname" . }}-api
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    component: api
  annotations:
    {{- range $key, $value := .Values.commonAnnotations }}
    {{ $key }}: {{ $value | quote }}
    {{- end }}
    {{- if .Values.api.annotations }}
    {{- toYaml .Values.api.annotations | nindent 4 }}
    {{- end }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  strategy:
    {{- if eq .Values.rollouts.strategy "canary" }}
    canary:
      steps:
        - setWeight: 20
        - pause: {duration: 30s}
        - setWeight: 50
        - pause: {duration: 30s}
        - setWeight: 100
    maxUnavailable: {{ .Values.rollouts.maxUnavailable }}
    maxSurge: {{ .Values.rollouts.maxSurge }}
    {{- else }}
    blueGreen:
      autoPromotionEnabled: false
      scaleDownDelaySeconds: 30
    {{- end }}
  selector:
    matchLabels:
      {{- include "bankops.selectorLabels" . | nindent 6 }}
      component: api
  template:
    metadata:
      labels:
        {{- include "bankops.labels" . | nindent 8 }}
        component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "bankops.name" . }}-api
      securityContext:
        {{- toYaml .Values.api.securityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ include "bankops.image" .Values.api.image }}
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            {{- toYaml .Values.api.command | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.api.containerPort }}
              protocol: TCP
          env:
            {{- toYaml .Values.api.env | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "bankops.name" . }}-config
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.api.containerSecurityContext | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.api.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.api.readinessProbe | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.api.startupProbe | nindent 12 }}
  analysis:
    templates:
      - name: success-rate
        args:
          - name: service-name
            value: {{ include "bankops.fullname" . }}-api
          - name: threshold
            value: "99"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bankops.fullname" . }}-api
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    component: api
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.api.containerPort }}
      protocol: TCP
  selector:
    {{- include "bankops.selectorLabels" . | nindent 4 }}
    component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bankops.fullname" . }}-api-canary
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    component: api
    rollouts: canary
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.api.containerPort }}
      protocol: TCP
  selector:
    {{- include "bankops.selectorLabels" . | nindent 4 }}
    component: api
{{- end }}