{{- if .Values.monitoring.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "bankops.fullname" . }}-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    app.kubernetes.io/component: servicemonitor
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "bankops.name" . }}-api
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
  namespaceSelector:
    matchNames:
      - {{ .Values.namespace }}
{{- end }}