{{- if .Values.ingress.enabled -}}
apiVersion: networking.x-k8s.io/v1alpha1
kind: HTTPRoute
metadata:
  name: {{ include "bankops.fullname" . }}-httproute
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "bankops.labels" . | nindent 4 }}
    app.kubernetes.io/component: httproute
spec:
  hostnames:
    {{- range .Values.ingress.hosts }}
    - {{ .host }}
    {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "bankops.fullname" . }}-api
          port: 8000
      matches:
        - path:
            type: PathPrefix
            value: /api/
    - backendRefs:
        - name: {{ include "bankops.fullname" . }}-frontend
          port: 80
      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
