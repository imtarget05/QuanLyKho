# ============================================================================
# BankOps Helm — production overrides
# ============================================================================

namespace: quanlykho

image:
  tag: "sha-${CI_COMMIT_SHORT_SHA:-latest}"
  pullPolicy: IfNotPresent

api:
  replicaCount: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

worker:
  replicaCount: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

frontend:
  replicaCount: 2

postgres:
  persistence:
    enabled: true
    storageClass: "fast-ssd"
    size: 20Gi
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

configmap:
  data:
    APP_ENV: "production"
    LOG_LEVEL: "INFO"
    ALLOWED_ORIGINS: '["https://quanlykho.internal"]'

secret:
  mode: external
  stringData:
    DATABASE_URL: "CHANGE_ME_REQUIRED"
    DB_PASSWORD: "CHANGE_ME_REQUIRED"
    BANKOPS_SIGNING_KEY: "CHANGE_ME_REQUIRED"
    BANKOPS_SESSION_SECRET: "CHANGE_ME_REQUIRED"

sealedSecret:
  enabled: false

externalSecret:
  enabled: true
  provider: awssm
  region: ap-southeast-1
  secretPath: bankops/production

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: bankops.yourbank.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - bankops.yourbank.com
      secretName: bankops-tls-cert

migration:
  enabled: true
  backoffLimit: 3

backup:
  enabled: true
  schedule: "0 2 * * *"

networkPolicy:
  enabled: true

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 2

monitoring:
  serviceMonitor:
    enabled: true
    endpoints:
      - port: http
        path: /metrics
        interval: 30s
        scrapeTimeout: 10s

otel:
  collector:
    enabled: true

rollouts:
  enabled: true
  strategy: canary
  maxUnavailable: 1
  maxSurge: 1
  analysis:
    enabled: true
    templates:
      - name: success-rate
        args:
          - name: service-name
            value: quanlykho-api
          - name: threshold
            value: "99"
