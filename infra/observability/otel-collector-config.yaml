# OpenTelemetry Collector config — nhận OTLP traces/metrics/logs từ QuanLyKho,
# SmartDoc, IncidentIQ rồi xuất ra Prometheus / Tempo / Loki.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: "bankops-api"
          static_configs:
            - targets: ["bankops-api.bankops.svc.cluster.local:8000"]
        - job_name: "bankops-worker"
          static_configs:
            - targets: ["bankops-worker.bankops.svc.cluster.local:8000"]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 1024
  attributes:
    actions:
      - key: service.namespace
        value: bankops
        action: upsert

exporters:
  otlp:
    endpoint: tempo.monitoring.svc.cluster.local:4317
    tls:
      insecure: true
  prometheusremotewrite:
    endpoint: "http://prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
  loki:
    endpoint: "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [otlp]
    metrics:
      receivers: [otlp, prometheus]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki]
