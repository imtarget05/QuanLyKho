auth:
  enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: loki_index_
        period: 24h

ruler:
  alertmanager_url: http://alertmanager.monitoring.svc.cluster.local:9093

compactor:
  working_directory: /loki/compactor

frontend:
  working_directory: /loki/frontend

querier:
  working_directory: /loki/querier

ingester:
  working_directory: /loki/ingester
