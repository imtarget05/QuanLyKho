apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: quanlykho
  namespace: quanlykho
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: portfolio-gateway
      namespace: platform-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /quanlykho/api/v1
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v1
      backendRefs:
        - name: bankops-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /quanlykho
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api/v1
      backendRefs:
        - name: bankops-api
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1
      backendRefs:
        - name: bankops-api
          port: 8000
