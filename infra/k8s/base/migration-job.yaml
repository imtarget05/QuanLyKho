apiVersion: batch/v1
kind: Job
metadata:
  name: bankops-migration
  labels:
    app.kubernetes.io/name: bankops-migration
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: bankops-system
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bankops-migration
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: migrate
          image: ghcr.io/imtarget05/bankops-api
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Applying Alembic database migrations..."
              alembic upgrade head
          envFrom:
            - configMapRef:
                name: bankops-config
            - secretRef:
                name: bankops-secrets
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
