apiVersion: v1
kind: Service
metadata:
  name: bankops-postgres
  labels:
    app.kubernetes.io/name: bankops-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: bankops-system
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: bankops-postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bankops-postgres
  labels:
    app.kubernetes.io/name: bankops-postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: bankops-system
spec:
  serviceName: bankops-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: bankops-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bankops-postgres
        app.kubernetes.io/component: database
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["postgres", "-c", "max_connections=150"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_DB
              value: bankops
            - name: POSTGRES_USER
              value: bankops_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: bankops-secrets
                  key: DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bankops_user", "-d", "bankops"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "bankops_user", "-d", "bankops"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
