apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: bankops-api
  labels:
    app.kubernetes.io/name: bankops-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: bankops-system
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: bankops-api
  namespaceSelector:
    matchNames:
      - quanlykho
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: true
